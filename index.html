<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Xcortex | Hub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0a0b10;--s:rgba(255,255,255,.03);--b:rgba(255,255,255,.08);--a:#ff5a2c;--t:#0fb3a6;--w:#fff;--m:#8b9bb4}
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:var(--bg);color:var(--w);min-height:100vh;display:flex;align-items:center;justify-content:center}
.cont{max-width:500px;width:100%;padding:20px;text-align:center}
h1{font-size:2rem;font-weight:800}h1 span{color:var(--a)}
.sub{color:var(--m);font-size:.75rem;text-transform:uppercase;margin-top:5px}
.btn{width:100%;padding:15px;border:none;border-radius:12px;font-weight:700;cursor:pointer;transition:.2s;margin-bottom:10px;font-size:1rem;display:flex;align-items:center;justify-content:center;gap:8px}
.main-btn{background:linear-gradient(135deg,var(--a),#ff7e5f);color:#fff}
.find-btn{background:rgba(255,255,255,.05);border:1px solid var(--b);color:var(--t)}
.hist-title{color:var(--m);font-size:.75rem;text-transform:uppercase;margin:20px 0 10px;border-bottom:1px solid var(--b);padding-bottom:5px;text-align:left}
.hist-list{display:flex;flex-direction:column;gap:8px}
.hist-item{background:var(--s);border:1px solid var(--b);border-radius:10px;padding:10px;display:flex;justify-content:space-between;align-items:center;font-size:.85rem}
.del{background:none;border:none;color:#f44;cursor:pointer;font-size:1.2rem}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:1000;display:none;justify-content:center;align-items:center}
.mo.act{display:flex}
.mc{width:90%;max-width:400px;background:#15161c;border:1px solid var(--b);border-radius:20px;padding:20px;max-height:85vh;overflow-y:auto}
.m-t{font-size:1.1rem;font-weight:700;text-align:center;margin-bottom:15px}
.ig{margin-bottom:10px;text-align:left}.lb{display:block;font-size:.7rem;color:var(--m);text-transform:uppercase;margin-bottom:5px}
.inp{width:100%;background:rgba(0,0,0,.2);border:1px solid var(--b);color:#fff;padding:10px;border-radius:8px;outline:none;font-size:1rem}
.br{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}
.bt{flex:1;min-width:100px;padding:10px;border-radius:8px;border:none;font-weight:600;cursor:pointer;font-size:.85rem;text-align:center}
.bt-pri{background:var(--t);color:#000}.bt-sec{background:rgba(255,255,255,.05);color:var(--w);border:1px solid var(--b)}.bt-nfc{background:linear-gradient(135deg,#00c6ff,#0072ff);color:#fff}
.st{display:none}.st.act{display:block}
.qr-o{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:2000;display:none;justify-content:center;align-items:center;flex-direction:column}
.qr-o.act{display:flex}.qc{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px}
.qv{font-family:monospace;font-size:1.5rem;color:var(--a);letter-spacing:3px;margin-bottom:15px}
.bw{background:#fff;color:#000;border:none;padding:10px 20px;border-radius:8px;font-weight:700;cursor:pointer}
.res-ov{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:3000;display:none;justify-content:center;align-items:center}
.res-ov.act{display:flex}
.rc{background:#1e2029;border:1px solid var(--t);padding:20px;border-radius:15px;text-align:center;max-width:300px}
.uid-d{font-family:monospace;font-size:1rem;color:var(--m);word-break:break-all;margin:10px 0;background:rgba(0,0,0,.2);padding:8px;border-radius:8px}
.em-r{font-size:1.1rem;color:var(--t);font-weight:bold;margin-top:10px}
.loader{width:30px;height:30px;border:3px solid var(--b);border-top-color:var(--t);border-radius:50%;animation:spin 1s linear infinite;margin:15px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.it{font-size:.8rem;color:var(--m);text-align:center;line-height:1.4;margin-bottom:15px}
.sm{font-size:.8rem;text-align:center;min-height:20px;margin:10px 0}
.sc{color:var(--t)}.er{color:#f44}
</style>
</head>
<body>
<div class="cont">
<header><h1>X<span>cortex</span></h1><div class="sub">Hub</div></header>
<button class="btn main-btn" onclick="OM()">🛡 Верифицировать</button>
<button class="btn find-btn" id="nfc-find-btn" onclick="startFindByUid()">🏷️ Найти по UID</button>
<div class="hist-title">История</div>
<div id="hl" class="hist-list"></div>
</div>
<div class="mo" id="vm"><div class="mc">
<div class="m-t" id="ms">Методы</div>
<div id="s1" class="st act">
<div class="ig"><label class="lb">Email</label><input type="email" id="ce" class="inp" placeholder="user@test.com"></div>
<p style="font-size:.7rem;color:var(--m);text-align:center;margin:5px 0;">Выберите метод:</p>
<div class="br"><button class="bt bt-sec" onclick="SEF()">📧 Почта</button><button class="bt bt-sec" onclick="SQF()">📱 QR</button></div>
<div class="br"><button class="bt bt-nfc" onclick="SNFC()">🏷️ NFC Bind</button><button class="bt bt-sec" onclick="SBR()">👆 Bio Reg</button></div>
<div class="br"><button class="bt bt-sec" onclick="CEB()">🔍 Bio Check</button><button class="bt bt-sec" onclick="showOTLMenu()">🔗 One-Time</button></div>
<div class="br"><button class="bt bt-sec" onclick="CM()" style="width:100%">Отмена</button></div>
</div>
<div id="s2" class="st"><div class="it" id="i2">Введите код</div><div class="ig"><input type="text" id="vi" class="inp" maxlength="6" inputmode="numeric" style="text-align:center;letter-spacing:5px"></div><div class="br"><button class="bt bt-sec" onclick="R1()">← Назад</button><button class="bt bt-pri" onclick="CV()">✅ Готово</button></div><div id="re" class="sm er hidden" style="color:#f44;text-align:center;font-size:.8rem">Неверный код!</div></div>
<div id="s3" class="st"><div style="text-align:center;font-size:2rem">📱</div><div class="it">Биометрия...</div><div id="bs" class="sm" style="text-align:center;color:var(--m)"></div><div class="br"><button class="bt bt-sec" onclick="R1()">Отмена</button></div></div>
<div id="s4" class="st"><div class="loader"></div><div class="it">Приложите карту к телефону</div><div id="nfs" class="sm sc" style="text-align:center;color:var(--t)">Ожидание...</div><div class="br"><button class="bt bt-sec" onclick="cancelNfcScan()">Отменить</button></div></div>
<div id="s-otl-menu" class="st"><div class="it">Тип ссылки:</div><div class="br"><button class="bt bt-pri" onclick="initOTL('pay')">💳 Оплата</button><button class="bt bt-sec" onclick="initOTL('verif')">🛡 Вериф</button></div><div class="br"><button class="bt bt-sec" onclick="R1()">← Назад</button></div></div>
<div id="s-otl-input" class="st"><div class="ig"><label class="lb" id="otl-lbl">Значение</label><input type="text" id="otl-val" class="inp"></div><div class="br"><button class="bt bt-nfc" onclick="genOTLLink()">🔒 Gen Link</button><button class="bt bt-sec" onclick="R1()">← Отмена</button></div></div>
<div id="ss" style="display:none;text-align:center;padding:20px 0"><div style="font-size:2rem">✨</div><h3 style="color:var(--t)">Успех!</h3><button class="bt bt-pri" onclick="FC()" style="margin-top:10px">Готово</button></div>
</div></div>
<div class="qr-o" id="qs"><div class="ql" id="qr-label" style="color:#fff;margin-bottom:10px">Сканируйте</div><div class="qc" id="qcc"></div><div class="qv" id="qvv">------</div><button class="bw" id="qr-action-btn" onclick="PFQ()">Шаг 2</button></div>
<div class="res-ov" id="res-ov"><div class="rc"><h3 style="color:white;margin-bottom:10px">Результат</h3><div class="uid-display uid-d" id="found-uid">UID: ...</div><div class="em-r" id="found-email">Email: ...</div><button class="bt bt-sec" onclick="document.getElementById('res-ov').classList.remove('act')" style="margin-top:15px;width:100%">Закрыть</button></div></div>
<script>
  let H=JSON.parse(localStorage.getItem('xu_h'))||[],C='',E='',M='',nfcReader=null,currentOtlType='';
RH();handleRoute();checkNfcSupport();
function checkNfcSupport(){const btn=document.getElementById('nfc-find-btn');if(!('NDEFReader'in window)){btn.innerHTML='⚠️ No NFC';btn.style.opacity='.5';btn.onclick=()=>alert("No Web NFC API")}}
function handleRoute(){const h=location.hash;if(h.startsWith('#/client')){document.querySelector('.cont').style.display='none';initClientView(h)}else{document.querySelector('.cont').style.display='block'}}
window.onhashchange=handleRoute;
function OM(){document.getElementById('vm').classList.add('act');R1()}
function CM(){document.getElementById('vm').classList.remove('act');setTimeout(()=>{['ce','vi'].forEach(id=>document.getElementById(id).value='');document.getElementById('re').classList.add('hidden')},300)}
function FC(){CM();RH()}
function R1(){document.querySelectorAll('.st').forEach(e=>e.classList.remove('act'));document.getElementById('s1').classList.add('act');document.getElementById('ss').style.display='none';document.getElementById('ms').innerText="Методы";document.getElementById('re').classList.add('hidden');C='';M=''}
function VE(){const e=document.getElementById('ce').value.trim();if(!e||!e.includes('@')){alert("Email?");return null}return e}
function GC(){return Math.floor(100000+Math.random()*900000).toString()}
function S2(t){document.querySelectorAll('.st').forEach(e=>e.classList.remove('act'));document.getElementById('s2').classList.add('act');document.getElementById('ms').innerText="Код";document.getElementById('i2').innerText=t;document.getElementById('vi').focus()}
function SS(){document.querySelectorAll('.st').forEach(e=>e.classList.remove('act'));document.getElementById('ss').style.display='block';document.getElementById('ms').innerText="Done"}
function SR(em,tp,uid=null){H.unshift({id:Date.now(),email:em,date:new Date().toLocaleString('ru-RU'),type:tp,uid});localStorage.setItem('xu_h',JSON.stringify(H));RH()}
function DL(id){if(confirm("Del?")){H=H.filter(h=>h.id!==id);localStorage.setItem('xu_h',JSON.stringify(H));RH()}}
function RH(){const l=document.getElementById('hl');l.innerHTML='';if(!H.length){l.innerHTML='<div style="text-align:center;color:var(--m);padding:10px;font-size:.8rem">Empty</div>';return}H.forEach(i=>{const d=document.createElement('div');d.className='hist-item';let ic=i.type==='email'?'📧':i.type==='qr'?'📱':i.type==='biometric'?'👆':i.type==='nfc'?'🏷️':'❓';d.innerHTML=`<div><strong>${ic} ${i.email}</strong><br><small style="color:var(--m)">${i.date} • ${i.type.toUpperCase()}</small></div><button class="del" onclick="DL(${i.id})">×</button>`;l.appendChild(d)})}
function SEF(){const em=VE();if(!em)return;E=em;M='email';C=GC();window.location.href=`mailto:${em}?subject=Xcortex&body=${encodeURIComponent(C)}`;S2("Mail sent")}
function SQF(){const em=VE();if(!em)return;E=em;M='qr';C=GC();new QRCode(document.getElementById('qcc'),{text:C,width:150,height:150});document.getElementById('qvv').innerText=C.split('').join(' ');document.getElementById('qr-label').innerText="Scan code";document.getElementById('qr-action-btn').onclick=PFQ;document.getElementById('qs').classList.add('act')}
function PFQ(){document.getElementById('qs').classList.remove('act');S2("Enter scanned code")}
async function SBR(){const em=VE();if(!em)return;E=em;M='bio_reg';document.querySelectorAll('.st').forEach(e=>e.classList.remove('act'));document.getElementById('s3').classList.add('act');document.getElementById('bs').innerHTML='Wait...';try{await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:"Xcortex",id:location.hostname},user:{id:new TextEncoder().encode(em),name:em,displayName:em},pubKeyCredParams:[{type:"public-key",alg:-7}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"}}});SR(E,'biometric');document.getElementById('bs').innerHTML='✅ Saved';setTimeout(SS,1000)}catch(er){document.getElementById('bs').innerHTML=`❌ ${er.message}`;setTimeout(R1,3000)}}
async function CEB(){const em=VE();if(!em)return;const su=H.find(h=>h.email===em&&h.type==='biometric');if(!su){alert("No bio reg");return}E=em;M='bio_check';document.querySelectorAll('.st').forEach(e=>e.classList.remove('act'));document.getElementById('s3').classList.add('act');document.getElementById('bs').innerHTML='Check...';try{const ac=[{type:"public-key",id:(()=>{const b=atob(su.credentialId||"");const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer})()}];await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,allowCredentials:ac,userVerification:"required"}});const idx=H.findIndex(h=>h.id===su.id);if(idx!==-1){H[idx].date=new Date().toLocaleString('ru-RU');localStorage.setItem('xu_h',JSON.stringify(H))}document.getElementById('bs').innerHTML='✅ OK';setTimeout(SS,1000)}catch(er){document.getElementById('bs').innerHTML=`❌ ${er.name}`;setTimeout(R1,3000)}}
async function SNFC(){const em=VE();if(!em)return;E=em;document.querySelectorAll('.st').forEach(e=>e.classList.remove('act'));document.getElementById('s4').classList.add('act');document.getElementById('ms').innerText="NFC Bind";document.getElementById('nfs').innerHTML='<span class="sc">Activating...</span>';try{if(!('NDEFReader'in window))throw new Error("No NFC");nfcReader=new NDEFReader();nfcReader.addEventListener("reading",()=>{document.getElementById('nfs').innerHTML='<span class="sc">Scanning...</span>'});nfcReader.addEventListener("message",async({serialNumber})=>{await nfcReader.stop();if(!serialNumber)throw new Error("No UID");SR(E,'nfc',serialNumber);document.getElementById('nfs').innerHTML=`<span class="sc">✅ UID: ${serialNumber.substring(0,10)}...</span>`;setTimeout(SS,1500)});nfcReader.addEventListener("error",(event)=>{document.getElementById('nfs').innerHTML=`<span class="er">❌ ${event.error.name}</span>`;setTimeout(cancelNfcScan,3000)});await nfcReader.scan()}catch(err){document.getElementById('nfs').innerHTML=`<span class="er">❌ ${err.message}</span>`;setTimeout(cancelNfcScan,3000)}}
function cancelNfcScan(){if(nfcReader)try{nfcReader.stop()}catch(e){};R1()}
async function startFindByUid(){if(!('NDEFReader'in window)){alert("No NFC");return}try{const r=new NDEFReader();r.addEventListener("message",async({serialNumber})=>{await r.stop();searchAndShowResult(serialNumber)});r.addEventListener("error",(e)=>alert("Err:"+e.error.name));await r.scan()}catch(err){alert("Start fail:"+err.message)}}
function searchAndShowResult(uid){const m=H.find(i=>i.type==='nfc'&&i.uid===uid);const ro=document.getElementById('res-ov'),ud=document.getElementById('found-uid'),ed=document.getElementById('found-email');ud.innerText="UID: "+uid;if(m){ed.innerText="Client: "+m.email;ed.style.color="#0fb3a6"}else{ed.innerText="Not Found";ed.style.color="#f44"}ro.classList.add('act')}
function CV(){const iv=document.getElementById('vi').value.trim(),ee=document.getElementById('re');ee.classList.add('hidden');if(!C){alert("Err");return}if(iv===C){SR(E,M);SS()}else{ee.innerText="Wrong!";ee.classList.remove('hidden');document.getElementById('vi').value='';document.getElementById('vi').focus()}}
function showOTLMenu(){document.querySelectorAll('.st').forEach(e=>e.classList.remove('act'));document.getElementById('s-otl-menu').classList.add('act');document.getElementById('ms').innerText="One-Time"}
function initOTL(type){currentOtlType=type;document.querySelectorAll('.st').forEach(e=>e.classList.remove('act'));document.getElementById('s-otl-input').classList.add('act');document.getElementById('ms').innerText="Data";const lbl=document.getElementById('otl-lbl'),val=document.getElementById('otl-val');lbl.innerText=type==='pay'?"Amount":"Type";val.placeholder=type==='pay'?"1000":"std";val.value=''}
async function genOTLLink(){const val=document.getElementById('otl-val').value.trim();if(!val)return alert("Val?");try{if(!window.PublicKeyCredential)throw new Error("No Auth");await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:"Xcortex",id:location.hostname},user:{id:new TextEncoder().encode(val),name:"admin",displayName:"A"},pubKeyCredParams:[{type:"public-key",alg:-7}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"}}});const p=btoa(JSON.stringify({t:currentOtlType,v:val,exp:Date.now()+120000}));const u=`${location.origin}${location.pathname}#/client?d=${p}`;new QRCode(document.getElementById('qcc'),{text:u,width:150,height:150});document.getElementById('qvv').innerText="ACTIVE";document.getElementById('qr-label').innerText="Scan Link";document.getElementById('qr-action-btn').innerText="Close";document.getElementById('qr-action-btn').onclick=()=>{document.getElementById('qs').classList.remove('act');R1()};document.getElementById('qs').classList.add('act')}catch(e){alert("Bio Err:"+e.message)}}
function initClientView(hash){let cd=document.getElementById('cli-container');if(!cd){cd=document.createElement('div');cd.id='cli-container';cd.style.cssText="max-width:400px;width:100%;padding:20px;text-align:center;";document.body.appendChild(cd)}const ps=new URLSearchParams(hash.split('?')[1]),ds=ps.get('d');if(!ds){cd.innerHTML="<h2 style='color:red'>Bad</h2>";return}try{const dt=JSON.parse(atob(ds));if(Date.now()>dt.exp){cd.innerHTML="<h2 style='color:red'>Exp</h2>";return}if(dt.t==='pay')cd.innerHTML=`<div class="mc"><h2 style="color:var(--a)">Pay</h2><p>${dt.v} ₽</p><button class="bt bt-pri" onclick="alert('Paying')">Go</button></div>`;else cd.innerHTML=`<div class="mc"><h2 style="color:var(--a)">Verify</h2><p>Show Code:</p><div style="font-size:2rem;color:var(--t);margin:10px 0">713876</div><input type="email" id="cli-em" class="inp" placeholder="Email"><button class="bt bt-pri" onclick="submitCli('${dt.v}')">Confirm</button></div>`}catch(e){cd.innerHTML="<h2>Error</h2>"}}
function submitCli(type){const em=document.getElementById('cli-em').value.trim();if(!em)return alert("Email");const r={id:Date.now(),email:em,date:new Date().toLocaleString('ru-RU'),type:'link_'+type};H.unshift(r);localStorage.setItem('xu_h',JSON.stringify(H));document.getElementById('cli-container').innerHTML="<h2 style='color:green'>OK</h2>"}
</script>
</body>
</html>
