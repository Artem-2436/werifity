<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Xcortex Verify</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>:root{--bg:#0a0b10;--s:rgba(255,255,255,.03);--b:rgba(255,255,255,.08);--a:#ff5a2c;--t:#0fb3a6;--w:#fff;--m:#8b9bb4}*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}body{background:var(--bg);color:var(--w);min-height:100vh;display:flex;align-items:center;justify-content:center}.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 30%,#1a1f35,transparent 40%),radial-gradient(circle at 80% 70%,#2d1b1b,transparent 40%);filter:blur(80px);opacity:.6;animation:f 20s infinite alternate ease-in-out}@keyframes f{0%{transform:translate(0,0)}100%{transform:translate(-20px,20px)}}.cont{max-width:500px;width:100%;padding:20px;text-align:center}h1{font-size:2rem;font-weight:800;letter-spacing:-1px;margin-bottom:5px}h1 span{color:var(--a)}.sub{color:var(--m);font-size:.8rem;text-transform:uppercase;margin-bottom:30px}.main-btn{width:100%;padding:20px;background:linear-gradient(135deg,var(--a),#ff7e5f);border:none;border-radius:16px;color:#fff;font-size:1.1rem;font-weight:700;cursor:pointer;box-shadow:0 10px 30px rgba(255,90,44,.3);transition:.3s;margin-bottom:20px}.main-btn:hover{transform:translateY(-2px)}.hist-title{color:var(--m);font-size:.8rem;text-transform:uppercase;margin-bottom:10px;border-bottom:1px solid var(--b);padding-bottom:5px}.hist-list{display:flex;flex-direction:column;gap:8px}.hist-item{background:var(--s);border:1px solid var(--b);border-radius:10px;padding:10px;display:flex;justify-content:space-between;align-items:center;font-size:.85rem}.h-info{text-align:left}.h-email{font-weight:600;color:var(--w)}.h-meta{font-size:.7rem;color:var(--m)}.del{background:none;border:none;color:#f44;cursor:pointer;font-size:1rem}.mo{position:fixed;inset:0;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);z-index:1000;display:none;justify-content:center;align-items:center}.mo.act{display:flex}.mc{width:90%;max-width:400px;background:#15161c;border:1px solid var(--b);border-radius:20px;padding:25px;transform:scale(.95);transition:.3s}.mo.act .mc{transform:scale(1)}.m-h{margin-bottom:20px}.m-t{font-size:1.1rem;font-weight:700}.m-s{font-size:.8rem;color:var(--m)}.ig{margin-bottom:15px}.lb{display:block;font-size:.7rem;color:var(--m);text-transform:uppercase;margin-bottom:5px}.inp{width:100%;background:rgba(0,0,0,.2);border:1px solid var(--b);color:#fff;padding:10px;border-radius:8px;outline:none}.inp:focus{border-color:var(--t)}.br{display:flex;gap:10px;margin-top:15px}.bt{flex:1;padding:10px;border-radius:8px;border:none;font-weight:600;cursor:pointer;font-size:.85rem}.bt-p{background:var(--t);color:#000}.bt-s{background:rgba(255,255,255,.05);color:#fff;border:1px solid var(--b)}.bt-e{background:rgba(255,255,255,.05);color:#fff;border:1px solid var(--b)}.bt-q{background:var(--a);color:#fff}.bt-b{background:linear-gradient(135deg,#6a11cb,#2575fc);color:#fff}.st{display:none}.st.act{display:block;animation:fi .3s}@keyframes fi{from{opacity:0}to{opacity:1}}.it{font-size:.8rem;color:var(--m);text-align:center;margin-bottom:15px;line-height:1.4}.bi{font-size:2rem;text-align:center;margin-bottom:10px}.sm{font-size:.8rem;text-align:center;min-height:20px}.sc{color:var(--t)}.er{color:#f44}.qr-o{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:2000;display:none;justify-content:center;align-items:center;flex-direction:column}.qr-o.act{display:flex}.qc{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px}.ql{color:#fff;font-size:1rem;margin-bottom:10px}.qv{font-family:monospace;font-size:1.5rem;color:var(--a);letter-spacing:3px;margin-bottom:15px}.bw{background:#fff;color:#000;border:none;padding:10px 20px;border-radius:8px;font-weight:700;cursor:pointer}</style></head><body><div class="bg"></div><div class="cont"><header><h1>X<span>cortex</span></h1><div class="sub">Universal Verify Hub</div></header><button class="main-btn" onclick="OM()">🛡 Верифицировать Клиента</button><div class="hist-title">История</div><div id="hl" class="hist-list"></div></div><div class="mo" id="vm"><div class="mc"><div class="m-h"><div class="m-t">Выбор Метода</div><div class="m-s" id="ms">Шаг 1: Данные</div></div><div id="s1" class="st act"><div class="ig"><label class="lb">Email клиента</label><input type="email" id="ce" class="inp" placeholder="user@example.com"></div><p style="font-size:.75rem;color:var(--m);margin-bottom:10px">Способ:</p><div class="br"><button class="bt bt-e" onclick="SEF()">📧 Почта</button><button class="bt bt-q" onclick="SQF()">📱 QR</button><button class="bt bt-b" onclick="SBR()">👆 Био</button></div><div class="br"><button class="bt bt-s" style="width:100%" onclick="CEB()">🔍 Сверить Био</button></div><div class="br"><button class="bt bt-s" onclick="CM()">Отмена</button></div></div><div id="s2" class="st"><div class="it" id="i2">Введите код.</div><div class="ig"><label class="lb">Код</label><input type="text" id="vi" class="inp" maxlength="6" inputmode="numeric" placeholder="______" style="text-align:center;letter-spacing:5px"></div><div class="br"><button class="bt bt-s" onclick="R1()">← Назад</button><button class="bt bt-p" onclick="CV()">✅ Завершить</button></div><div id="re" class="sm er" style="display:none">Неверный код!</div></div><div id="s3" class="st"><div class="bi">📱</div><div class="it">Подтвердите личность...</div><div id="bs" class="sm"></div><div class="br"><button class="bt bt-s" onclick="R1()">Отмена</button></div></div><div id="ss" style="display:none;text-align:center;padding:20px 0"><div style="font-size:2rem;margin-bottom:10px">✨</div><h3 style="color:var(--t)">Успешно!</h3><p style="color:var(--m);font-size:.8rem;margin-bottom:15px">Верифицировано.</p><button class="bt bt-p" onclick="FC()">Готово</button></div></div></div><div class="qr-o" id="qs"><div class="ql">Сканируйте код</div><div class="qc" id="qcc"></div><div class="qv" id="qvv">------</div><button class="bw" onclick="PFQ()">Шаг 2: Сверить</button></div><script>let H=JSON.parse(localStorage.getItem('xu_h'))||[],C='',E='',M='';function RH(){const l=document.getElementById('hl');l.innerHTML='';if(!H.length){l.innerHTML='<div style="text-align:center;color:var(--m);padding:10px;font-size:.8rem">Пусто</div>';return}H.forEach(i=>{const d=document.createElement('div');d.className='hist-item';let ic=i.type==='email'?'📧':i.type==='qr'?'📱':'';d.innerHTML=`<div class="h-info"><div class="h-email">${ic} ${i.email}</div><div class="h-meta">${i.date} • ${i.type.toUpperCase()}</div></div><button class="del" onclick="DL(${i.id})">×</button>`;l.appendChild(d)})}RH();function OM(){document.getElementById('vm').classList.add('act');R1()}function CM(){document.getElementById('vm').classList.remove('act');setTimeout(()=>{document.getElementById('ce').value='';document.getElementById('vi').value='';document.getElementById('re').style.display='none';document.getElementById('bs').innerText=''},300)}function FC(){CM();RH()}function R1(){document.querySelectorAll('.st').forEach(e=>e.classList.remove('active'));document.getElementById('s1').classList.add('act');document.getElementById('ss').style.display='none';document.getElementById('ms').innerText="Шаг 1: Данные";document.getElementById('re').style.display='none';C='';M=''}function VE(){const e=document.getElementById('ce').value.trim();if(!e||!e.includes('@')){alert("Введите Email");return null}return e}function GC(){return Math.floor(100000+Math.random()*900000).toString()}function S2(t){document.querySelectorAll('.st').forEach(e=>e.classList.remove('active'));document.getElementById('s2').classList.add('act');document.getElementById('ms').innerText="Шаг 2: Код";document.getElementById('i2').innerText=t;document.getElementById('vi').focus()}function SS(){document.querySelectorAll('.st').forEach(e=>e.classList.remove('active'));document.getElementById('ss').style.display='block';document.getElementById('ms').innerText="Завершено"}function SR(em,tp){H.unshift({id:Date.now(),email:em,date:new Date().toLocaleString('ru-RU'),status:'verified',type:tp,createdAt:Date.now()});localStorage.setItem('xu_h',JSON.stringify(H))}function DL(id){if(confirm("Удалить?")){H=H.filter(h=>h.id!==id);localStorage.setItem('xu_h',JSON.stringify(H));RH()}}function SEF(){const em=VE();if(!em)return;E=em;M='email';C=GC();const s=encodeURIComponent("Верификация Xcortex"),b=encodeURIComponent(`Код:\n\n${C}\n\nНикому не сообщайте.`);window.location.href=`mailto:${em}?subject=${s}&body=${b}`;S2("Письмо отправлено. Введите код.")}function SQF(){const em=VE();if(!em)return;E=em;M='qr';C=GC();const c=document.getElementById('qcc');c.innerHTML="";new QRCode(c,{text:C,width:200,height:200,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.H});document.getElementById('qvv').innerText=C.split('').join(' ');document.getElementById('qs').classList.add('act')}function PFQ(){document.getElementById('qs').classList.remove('act');S2("Клиент показал код. Введите его.")}async function SBR(){const em=VE();if(!em)return;E=em;M='bio_reg';document.querySelectorAll('.st').forEach(e=>e.classList.remove('active'));document.getElementById('s3').classList.add('act');document.getElementById('ms').innerText="Биометрия";document.getElementById('bs').innerHTML='<span class="sc">Ожидание...</span>';try{const ch=crypto.getRandomValues(new Uint8Array(32)),ue={id:new TextEncoder().encode(em),name:em,displayName:em},po={challenge:ch,rp:{name:"Xcortex",id:location.hostname},user:ue,pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"},timeout:60000};const cr=await navigator.credentials.create({publicKey:po}),ci=btoa(String.fromCharCode(...new Uint8Array(cr.rawId)));SR(E,'biometric');document.getElementById('bs').innerHTML='<span class="sc">✅ Ключ сохранен!</span>';setTimeout(SS,1000)}catch(er){console.error(er);document.getElementById('bs').innerHTML=`<span class="er">❌ ${er.message}</span>`;setTimeout(R1,3000)}}async function CEB(){const em=VE();if(!em)return;const su=H.find(h=>h.email===em&&h.type==='biometric');if(!su){alert("Нет записи.");return}E=em;M='bio_check';document.querySelectorAll('.st').forEach(e=>e.classList.remove('active'));document.getElementById('s3').classList.add('act');document.getElementById('ms').innerText="Сверка";document.getElementById('bs').innerHTML='<span class="sc">Запрос...</span>';try{const ac=[{type:"public-key",id:(()=>{const b=atob(su.credentialId);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer})()}],ch=crypto.getRandomValues(new Uint8Array(32)),po={challenge:ch,rpId:location.hostname,allowCredentials:ac,userVerification:"required",timeout:60000};await navigator.credentials.get({publicKey:po});const idx=H.findIndex(h=>h.id===su.id);if(idx!==-1){H[idx].date=new Date().toLocaleString('ru-RU');localStorage.setItem('xu_h',JSON.stringify(H))}document.getElementById('bs').innerHTML='<span class="sc">✅ Подтверждено!</span>';setTimeout(SS,1000)}catch(er){console.error(er);document.getElementById('bs').innerHTML=`<span class="er">❌ ${er.name}</span>`;setTimeout(R1,3000)}}function CV(){const iv=document.getElementById('vi').value.trim(),ee=document.getElementById('re');ee.style.display='none';if(!C){alert("Ошибка");return}if(iv===C){SR(E,M);SS()}else{ee.innerText="Неверный код!";ee.style.display='block';document.getElementById('vi').value='';document.getElementById('vi').focus()}}document.getElementById('vm').addEventListener('click',function(e){if(e.target===this)CM()});</script></body></html>
