<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xcortex | Admin Verify</title>
<!-- Подключаем библиотеку для генерации QR -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0a0b10;--s:rgba(255,255,255,.03);--b:rgba(255,255,255,.08);--a:#ff5a2c;--t:#0fb3a6;--w:#fff;--m:#8b9bb4}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,sans-serif}
body{background:var(--bg);color:var(--w);min-height:100vh;overflow-x:hidden}
.bg-mesh{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 30%,#1a1f35,transparent 40%),radial-gradient(circle at 80% 70%,#2d1b1b,transparent 40%);filter:blur(80px);opacity:.6;animation:f 20s infinite alternate ease-in-out}
@keyframes f{0%{transform:translate(0,0)}100%{transform:translate(-20px,20px)}}
.container{max-width:600px;margin:0 auto;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
header{text-align:center;margin-bottom:30px;width:100%}
h1{font-size:2rem;font-weight:800;letter-spacing:-1px}
h1 span{color:var(--a)}
.sub{color:var(--m);font-size:.9rem;text-transform:uppercase;letter-spacing:1px;margin-top:5px}

/* Main Button */
.main-btn{width:100%;padding:25px;background:linear-gradient(135deg,var(--a),#ff7e5f);border:none;border-radius:20px;color:#fff;font-size:1.2rem;font-weight:700;cursor:pointer;box-shadow:0 10px 30px rgba(255,90,44,.3);transition:.3s;text-transform:uppercase;letter-spacing:1px;margin-bottom:30px}
.main-btn:hover{transform:translateY(-3px);box-shadow:0 15px 40px rgba(255,90,44,.5)}

/* History List */
.history-title{width:100%;text-align:left;color:var(--m);font-size:.9rem;text-transform:uppercase;margin-bottom:15px;border-bottom:1px solid var(--b);padding-bottom:10px}
.hist-list{width:100%;display:flex;flex-direction:column;gap:10px}
.hist-item{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:15px;display:flex;justify-content:space-between;align-items:center;transition:.2s}
.hist-item:hover{background:rgba(255,255,255,.05)}
.h-info{display:flex;flex-direction:column;gap:4px}
.h-email{font-weight:600;font-size:.95rem;color:var(--w)}
.h-date{font-size:.75rem;color:var(--m)}
.h-status{font-size:.7rem;padding:2px 8px;border-radius:10px;font-weight:700;text-transform:uppercase}
.st-ok{background:rgba(15,179,166,.15);color:var(--t)}
.del-btn{background:none;border:none;color:#f44;cursor:pointer;opacity:.5;font-size:1.2rem;padding:5px}
.del-btn:hover{opacity:1}

/* Modal Overlay for QR Code */
.qr-overlay{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:2000;display:none;justify-content:center;align-items:center;flex-direction:column;backdrop-filter:blur(10px)}
.qr-overlay.active{display:flex}
.qr-card{background:#fff;padding:20px;border-radius:15px;box-shadow:0 0 50px rgba(255,255,255,.2);margin-bottom:20px}
.qr-label{color:#fff;font-size:1.2rem;margin-bottom:10px;text-align:center}
.qr-code-val{font-family:monospace;font-size:2rem;color:var(--a);letter-spacing:5px;margin-bottom:20px;text-shadow:0 0 10px rgba(255,90,44,.5)}
.btn-white{background:#fff;color:#000;border:none;padding:15px 30px;border-radius:10px;font-weight:700;cursor:pointer;font-size:1rem;transition:.2s}
.btn-white:hover{transform:scale(1.05)}

/* Standard Modal Styles (from previous version) */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);z-index:1000;display:none;justify-content:center;align-items:center;opacity:0;transition:.3s}
.modal-overlay.active{display:flex;opacity:1}
.modal-card{width:90%;max-width:400px;background:linear-gradient(180deg,#1e2029,#15161c);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:30px;transform:scale(.95);transition:.3s cubic-bezier(.175,.885,.32,1.275);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.modal-overlay.active .modal-card{transform:scale(1)}
.m-header{margin-bottom:20px;text-align:center}
.m-title{font-size:1.2rem;font-weight:700;color:var(--w)}
.m-sub{font-size:.8rem;color:var(--m);margin-top:5px}
.input-group{margin-bottom:15px}
.label{display:block;font-size:.8rem;color:var(--m);margin-bottom:5px;text-transform:uppercase}
.input{width:100%;background:rgba(0,0,0,.2);border:1px solid var(--b);color:#fff;padding:12px;border-radius:10px;outline:none;font-size:1rem}
.input:focus{border-color:var(--t)}
.btn-row{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:12px;border-radius:10px;border:none;font-weight:600;cursor:pointer;transition:.2s;font-size:.9rem}
.btn-primary{background:var(--t);color:#000}
.btn-primary:hover{background:#0dc4b6}
.btn-secondary{background:rgba(255,255,255,.05);color:var(--w);border:1px solid var(--b)}
.btn-secondary:hover{background:rgba(255,255,255,.1)}
.btn-accent{background:var(--a);color:#fff} /* New button style for QR generation */
.btn-accent:hover{background:#ff7e5f}

/* Steps inside modal */
.step-send, .step-verify { display: none; }
.step-send.active, .step-verify.active { display: block; animation: fadeIn .3s; }
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.info-text{font-size:.8rem;color:var(--m);text-align:center;line-height:1.4;margin-bottom:15px}
.success-msg{color:var(--t);font-size:.9rem;margin-top:10px;display:none;text-align:center}
.error-msg{color:#f44;font-size:.9rem;margin-top:10px;display:none;text-align:center}
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="container">
    <header>
        <h1>X<span>cortex</span></h1>
        <div class="sub">Admin Verification Panel</div>
    </header>

    <button class="main-btn" onclick="openModal()">🛡 Верифицировать Клиента</button>

    <div class="history-title">История Верификаций</div>
    <div id="hist-list" class="hist-list"></div>
</div>

<!-- MODAL: MAIN VERIFICATION FLOW -->
<div class="modal-overlay" id="verify-modal">
    <div class="modal-card">
        <div class="m-header">
            <div class="m-title">Новая Проверка</div>
            <div class="m-sub" id="modal-subtext">Шаг 1: Данные клиента</div>
        </div>

        <!-- STEP 1: INPUT EMAIL & ACTIONS -->
        <div id="step-1" class="step-send active">
            <div class="input-group">
                <label class="label">Email клиента</label>
                <input type="email" id="client-email" class="input" placeholder="user@example.com">
            </div>
            
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn btn-accent" style="flex:1" onclick="generateAndShowQR()">📱 Сгенерировать QR</button>
                <button class="btn btn-secondary" style="flex:1" onclick="sendCodeAction()">📧 Отправить Email</button>
            </div>
            
            <div class="btn-row">
                <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
            </div>
        </div>

        <!-- STEP 2: VERIFY CODE (After QR scan or Email send) -->
        <div id="step-2" class="step-verify">
            <div class="info-text">
                Попросите клиента показать код,<br>который он получил после сканирования<br>или из письма. Введите его ниже.
            </div>
            
            <div class="input-group">
                <label class="label">Код подтверждения</label>
                <input type="text" id="verify-input" class="input" maxlength="6" inputmode="numeric" placeholder="______" style="text-align:center; font-size:1.5rem; letter-spacing:5px;">
            </div>
            
            <div class="btn-row">
                <button class="btn btn-secondary" onclick="resetToStep1()">← Назад</button>
                <button class="btn btn-primary" onclick="checkVerification()">✅ Завершить</button>
            </div>
            <div id="result-error" class="error-msg">Неверный код!</div>
        </div>
        
        <!-- SUCCESS STATE -->
        <div id="step-3" style="display:none;text-align:center;padding:20px 0;">
            <div style="font-size:3rem;margin-bottom:10px">✨</div>
            <h3 style="color:var(--t);margin-bottom:10px">Успешно!</h3>
            <p style="color:var(--m);font-size:.9rem;margin-bottom:20px">Клиент верифицирован.</p>
            <button class="btn btn-primary" onclick="finishAndClose()">Готово</button>
        </div>
    </div>
</div>

<!-- FULLSCREEN OVERLAY FOR QR CODE -->
<div class="qr-overlay" id="qr-screen">
    <div class="qr-label">Отсканируйте этот код телефоном</div>
    <div class="qr-card" id="qrcode-container"></div>
    <div class="qr-code-val" id="qr-display-value">------</div>
    <button class="btn-white" onclick="proceedToVerifyStep()">Шаг 2: Сверить код</button>
</div>

<script>
// State
let history = JSON.parse(localStorage.getItem('xc_verify_hist')) || [];
let currentSecretCode = ''; // The code generated for this session
let currentEmail = '';

// Init Render
renderHistory();

// --- MODAL CONTROL ---
function openModal() {
    document.getElementById('verify-modal').classList.add('active');
    resetToStep1();
}

function closeModal() {
    document.getElementById('verify-modal').classList.remove('active');
    setTimeout(() => {
        document.getElementById('client-email').value = '';
        document.getElementById('verify-input').value = '';
        document.getElementById('result-error').style.display = 'none';
    }, 300);
}

function finishAndClose() {
    closeModal();
    renderHistory();
}

function resetToStep1() {
    document.getElementById('step-1').classList.add('active');
    document.getElementById('step-2').classList.remove('active');
    document.getElementById('step-3').style.display = 'none';
    document.getElementById('modal-subtext').innerText = "Шаг 1: Данные клиента";
    document.getElementById('result-error').style.display = 'none';
    currentSecretCode = ''; // Clear old code
}

// --- LOGIC: GENERATE QR ---
function generateAndShowQR() {
    const emailInput = document.getElementById('client-email');
    const email = emailInput.value.trim();
    
    if (!email || !email.includes('@')) {
        alert("Введите корректный Email");
        return;
    }

    currentEmail = email;
    
    // 1. Generate Random 6-digit code
    currentSecretCode = Math.floor(100000 + Math.random() * 900000).toString();
    
    // 2. Prepare QR Container
    const container = document.getElementById('qrcode-container');
    container.innerHTML = ""; // Clear previous QR
    
    // 3. Create QR Code using library
    new QRCode(container, {
        text: currentSecretCode,
        width: 256,
        height: 256,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
    });

    // 4. Show the code value below QR for admin reference too
    document.getElementById('qr-display-value').innerText = currentSecretCode.split('').join(' ');

    // 5. Show Fullscreen Overlay
    document.getElementById('qr-screen').classList.add('active');
}

// Transition from QR Screen to Verify Input Step
function proceedToVerifyStep() {
    document.getElementById('qr-screen').classList.remove('active');
    
    // Switch main modal to Step 2
    document.getElementById('step-1').classList.remove('active');
    document.getElementById('step-2').classList.add('active');
    document.getElementById('modal-subtext').innerText = "Шаг 2: Подтверждение кода";
    
    // Focus input
    document.getElementById('verify-input').focus();
}

// --- LOGIC: SEND EMAIL (Legacy support) ---
function sendCodeAction() {
    const emailInput = document.getElementById('client-email');
    const email = emailInput.value.trim();
    
    if (!email || !email.includes('@')) {
        alert("Введите корректный Email");
        return;
    }

    currentEmail = email;
    currentSecretCode = Math.floor(100000 + Math.random() * 900000).toString();
    
    const subject = encodeURIComponent("Верификация устройства Xcortex");
    const bodyContent = `Здравствуйте!\n\nВаш код подтверждения верификации:\n\n${currentSecretCode}\n\nНикому его не сообщайте.\nСверьте его в терминале администратора.\nЕсли код пришел по ошибке, ничего не делайте.\n\n— Команда Xcortex`;
    const body = encodeURIComponent(bodyContent);
    
    const mailtoLink = `mailto:${email}?subject=${subject}&body=${body}`;
    window.location.href = mailtoLink;

    // Go straight to verification step since email was sent
    document.getElementById('step-1').classList.remove('active');
    document.getElementById('step-2').classList.add('active');
    document.getElementById('modal-subtext').innerText = "Шаг 2: Подтверждение кода";
    document.getElementById('verify-input').focus();
}

// --- LOGIC: CHECK CODE ---
function checkVerification() {
    const inputVal = document.getElementById('verify-input').value.trim();
    const errorEl = document.getElementById('result-error');
    
    errorEl.style.display = 'none';

    if (!currentSecretCode) {
        alert("Ошибка: Код не сгенерирован.");
        return;
    }

    if (inputVal === currentSecretCode) {
        // Success
        saveToHistory(currentEmail, 'verified');
        
        // Show Success Screen
        document.getElementById('step-2').classList.remove('active');
        document.getElementById('step-3').style.display = 'block';
    } else {
        // Fail
        errorEl.style.display = 'block';
        document.getElementById('verify-input').value = '';
        document.getElementById('verify-input').focus();
    }
}

// --- DATA MANAGEMENT ---
function saveToHistory(email, status) {
    const record = {
        id: Date.now(),
        email: email,
        date: new Date().toLocaleString('ru-RU'),
        status: status
    };
    history.unshift(record);
    localStorage.setItem('xc_verify_hist', JSON.stringify(history));
}

function deleteRecord(id) {
    if(!confirm("Удалить эту запись?")) return;
    history = history.filter(h => h.id !== id);
    localStorage.setItem('xc_verify_hist', JSON.stringify(history));
    renderHistory();
}

function renderHistory() {
    const list = document.getElementById('hist-list');
    list.innerHTML = '';
    
    if (history.length === 0) {
        list.innerHTML = '<div style="text-align:center;color:var(--m);padding:20px;font-size:.9rem">История пуста</div>';
        return;
    }

    history.forEach(item => {
        const div = document.createElement('div');
        div.className = 'hist-item';
        
        const statusClass = item.status === 'verified' ? 'st-ok' : 'st-pend';
        const statusText = item.status === 'verified' ? 'Verified' : 'Pending';

        div.innerHTML = `
            <div class="h-info">
                <span class="h-email">${item.email}</span>
                <span class="h-date">${item.date}</span>
            </div>
            <div style="display:flex;align-items:center;gap:10px">
                <span class="h-status ${statusClass}">${statusText}</span>
                <button class="del-btn" onclick="deleteRecord(${item.id})">×</button>
            </div>
        `;
        list.appendChild(div);
    });
}

// Close modal on outside click
document.getElementById('verify-modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});
</script>
</body>
</html>
